[project]
name = "strata"
version = "0.1.0"
description = "Content-addressed build system for local RAG preparation pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "liteparse>=2,<3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
strata = "strata.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
