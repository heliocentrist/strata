project_id: local-files-example
tenant_id: default

state:
  url: sqlite:///./.strata/state.db

artifacts:
  path: ./.strata/artifacts

sources:
  docs:
    type: local_files
    path: ./docs
    include: ["**/*.md", "**/*.txt"]

pipeline:
  parsed:
    source: docs
    operation: liteparse
    version: liteparse@0.1.0

  chunks:
    input: parsed
    operation: fixed_token_chunker
    version: fixed_token_chunker@0.1.0
    config:
      output_label: chunk
      max_chars: 120
      overlap_chars: 10

  embeddings:
    input: chunks
    operation: fake_embedding
    version: fake_embedding@0.1.0
    config:
      dimensions: 8

  sink:
    input: embeddings
    operation: local_sqlite_vector_sink
    version: local_sqlite_vector_sink@0.1.0

tests:
  - name: chunks_not_empty
    asset: chunks
    type: not_empty

  - name: embeddings_have_expected_dimensions
    asset: embeddings
    type: embedding_dimensions

  - name: chunks_keep_source_identity
    asset: chunks
    type: source_item_key_present
